[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "image-processing-workbench"
version = "0.1.0"
description = "A small Python image-processing CLI with generated sample inputs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3.0",
  "Pillow>=10.0",
]

[project.scripts]
image-workbench = "image_workbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
